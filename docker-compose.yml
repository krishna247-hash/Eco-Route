services:
  postgres:
    image: postgres:16
    container_name: ecoroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecoroute
      POSTGRES_PASSWORD: ecoroute
      POSTGRES_DB: ecoroute
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoroute -d ecoroute"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ecoroute-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
